name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 提取版本号
  prepare:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      build_number: ${{ github.run_number }}
    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

  # 调用 Docker 构建
  docker:
    name: Docker
    needs: prepare
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      packages: write

  # 调用 Android 构建
  android:
    name: Android
    needs: prepare
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
    secrets: inherit

  # 调用 macOS 构建
  macos:
    name: macOS
    needs: prepare
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}

  # 调用 Windows 构建
  windows:
    name: Windows
    needs: prepare
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}

  # 创建 GitHub Release
  release:
    name: Create Release
    needs: [prepare, docker, android, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/android-apk/*.apk
            artifacts/macos-app/*.zip
            artifacts/windows-app/*.zip
          body: |
            ## 📦 版本 v${{ needs.prepare.outputs.version }}
            
            ### Docker 部署 (推荐)
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}
            
            # 或使用 docker-compose
            wget https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
            docker-compose up -d
            ```
            
            ### 客户端下载
            
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Android | `personal-ledger-${{ needs.prepare.outputs.version }}-android.apk` | 直接安装 |
            | macOS | `personal-ledger-${{ needs.prepare.outputs.version }}-macos.zip` | 解压后运行，首次需在安全设置中允许 |
            | Windows | `personal-ledger-${{ needs.prepare.outputs.version }}-windows.zip` | 解压后运行 |
