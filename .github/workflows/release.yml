name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 提取版本号
  prepare:
    name: Prepare Version
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      build_number: ${{ steps.version.outputs.BUILD_NUMBER }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Get version from tag
        id: version
        env:
          INPUT_VERSION: ${{ github.ref_name }}
          INPUT_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/resolve-release-version.sh --require-build-number

  web:
    name: Web quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/web.yml

  backend:
    name: Backend and database quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/backend-database.yml

  mobile-quality:
    name: Flutter quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/mobile-quality.yml

  mobile-e2e:
    name: Mobile real-backend E2E gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/mobile-e2e.yml

  public-git-safety:
    name: Public repository safety gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/public-git-safety.yml

  backup-security:
    name: Backup and security contracts
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/security-contracts.yml

  # 调用 Docker 构建
  docker:
    name: Docker
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, backend, web, mobile-quality, mobile-e2e, public-git-safety, backup-security]
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      packages: write

  # 调用 Android 构建
  android:
    name: Android
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, backend, web, mobile-quality, mobile-e2e, public-git-safety, backup-security]
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
    secrets: inherit

  verify-android-artifact:
    name: Verify Android Artifact
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'

      - name: Install Android signature tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::error title=Missing Android SDK manager::sdkmanager is required before verifying Android signatures"
            exit 1
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Download Android artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: artifacts/android-release

      - name: Verify Android artifact signatures
        env:
          RELEASE_ARTIFACT_DIR: artifacts
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REQUIRE_IOS_ARTIFACT: '0'
          VERIFY_ARTIFACT_SIGNATURES: '1'
        run: ./scripts/check-release-artifact-files.sh

  # 调用 iOS 构建
  ios:
    name: iOS
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, backend, web, mobile-quality, mobile-e2e, public-git-safety, backup-security]
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
    secrets: inherit

  verify-ios-artifact:
    name: Verify iOS Artifact
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, ios]
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download iOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-ipa
          path: artifacts/ios-ipa

      - name: Verify iOS artifact signature
        env:
          RELEASE_ARTIFACT_DIR: artifacts
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REQUIRE_ANDROID_ARTIFACTS: '0'
          REQUIRE_IOS_ARTIFACT: '1'
          VERIFY_ARTIFACT_SIGNATURES: '1'
        run: ./scripts/check-release-artifact-files.sh

  # 创建 GitHub Release
  release:
    name: Create Release
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, backend, web, mobile-quality, mobile-e2e, public-git-safety, backup-security, docker, android, verify-android-artifact, ios, verify-ios-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Verify Android release artifact checksums
        env:
          RELEASE_ARTIFACT_DIR: artifacts
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REQUIRE_IOS_ARTIFACT: '0'
        run: ./scripts/check-release-artifact-files.sh

      - name: Verify iOS release artifact checksums
        env:
          RELEASE_ARTIFACT_DIR: artifacts
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REQUIRE_ANDROID_ARTIFACTS: '0'
          REQUIRE_IOS_ARTIFACT: '1'
        run: ./scripts/check-release-artifact-files.sh

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/android-release/*.apk
            artifacts/android-release/*.apk.sha256
            artifacts/android-release/*.aab
            artifacts/android-release/*.aab.sha256
            artifacts/ios-ipa/*.ipa
            artifacts/ios-ipa/*.ipa.sha256
          body: |
            ## 📦 版本 v${{ needs.prepare.outputs.version }}
            
            ### Docker 部署 (推荐)
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}
            # Immutable digest: ghcr.io/${{ github.repository }}@${{ needs.docker.outputs.image_digest }}
            
            # 或使用当前 tag 的 compose 文件固定版本部署
            curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/refs/tags/v${{ needs.prepare.outputs.version }}/docker-compose.yml
            export LEDGER_IMAGE=ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}
            export LEDGER_SERVER_MODE=release
            docker compose up -d
            ```
            
            ### 客户端下载
            
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Android | `personal-ledger-${{ needs.prepare.outputs.version }}-android.apk` | 已使用 release keystore 签名 |
            | Android | `personal-ledger-${{ needs.prepare.outputs.version }}-android.aab` | 已使用 release keystore 签名，适合正式商店分发 |
            | iOS | `personal-ledger-${{ needs.prepare.outputs.version }}-ios.ipa` | 已使用 Apple 签名材料导出 |
            | Docker digest | `ghcr.io/${{ github.repository }}@${{ needs.docker.outputs.image_digest }}` | 不可变镜像引用 |
            | 校验文件 | `*.sha256` | 用于核对下载产物的 SHA-256 |

            macOS 和 Windows 客户端仍在平台回归阶段，暂不随本次 GitHub Release 发布。
