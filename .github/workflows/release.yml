name: Signed Mobile Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing Docker/Web release version, for example 1.0.8
        required: true
        type: string
      build_number:
        description: Mobile build number; leave empty to use the workflow run number
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: personal-ledger-release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate existing protected release target
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      build_number: ${{ steps.version.outputs.BUILD_NUMBER }}
    permissions:
      contents: read
    steps:
      - name: Checkout selected release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: ./scripts/resolve-release-version.sh --require-build-number

      - name: Verify repository version matches release input
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./scripts/check-version-consistency.sh

      - name: Require immutable tag on main and an existing Docker/Web release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          tag="v${RELEASE_VERSION}"
          if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
            echo "::error title=Wrong workflow ref::Run this workflow from the existing ${tag} tag, not ${GITHUB_REF}"
            exit 1
          fi

          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error title=Tag commit mismatch::${tag} does not resolve to the selected workflow commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error title=Release is not on main::${tag} must point to a commit contained in origin/main"
            exit 1
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          if [ "$(jq -r '.draft' <<<"$release_json")" != "false" ]; then
            echo "::error title=Release is not published::The Docker/Web release for ${tag} must exist and not be a draft"
            exit 1
          fi

          existing_assets="$(jq -r '.assets[].name' <<<"$release_json")"
          compose_asset="docker-compose-v${RELEASE_VERSION}.yml"
          compose_checksum_asset="${compose_asset}.sha256"
          for asset in "$compose_asset" "$compose_checksum_asset"; do
            if ! grep -Fxq "$asset" <<<"$existing_assets"; then
              echo "::error title=Incomplete Docker/Web release::Required release asset is missing: $asset"
              exit 1
            fi
          done

          expected_assets=(
            "personal-ledger-${RELEASE_VERSION}-android.apk"
            "personal-ledger-${RELEASE_VERSION}-android.apk.sha256"
            "personal-ledger-${RELEASE_VERSION}-android.aab"
            "personal-ledger-${RELEASE_VERSION}-android.aab.sha256"
            "personal-ledger-${RELEASE_VERSION}-ios.ipa"
            "personal-ledger-${RELEASE_VERSION}-ios.ipa.sha256"
          )
          for asset in "${expected_assets[@]}"; do
            if grep -Fxq "$asset" <<<"$existing_assets"; then
              echo "::error title=Release asset already exists::Refusing to overwrite $asset"
              exit 1
            fi
          done

          release_contract_dir="${RUNNER_TEMP}/docker-web-release-contract"
          mkdir -p "$release_contract_dir"
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$compose_asset" \
            --pattern "$compose_checksum_asset" \
            --dir "$release_contract_dir"

          compose_path="$release_contract_dir/$compose_asset"
          checksum_path="$release_contract_dir/$compose_checksum_asset"
          line_count="$(awk 'END { print NR + 0 }' "$checksum_path")"
          read -r checksum_digest checksum_name checksum_extra <"$checksum_path"
          if [ "$line_count" != "1" ] || \
             [[ ! "$checksum_digest" =~ ^[0-9a-f]{64}$ ]] || \
             [ "$checksum_name" != "$compose_asset" ] || \
             [ -n "${checksum_extra:-}" ]; then
            echo "::error title=Invalid Compose checksum::Expected one sha256sum line for $compose_asset"
            exit 1
          fi
          (
            cd "$release_contract_dir"
            sha256sum -c "$compose_checksum_asset"
          )

          compose_image="$(env \
            LEDGER_JWT_SECRET=release-contract-validation-only-000000000000 \
            LEDGER_SETUP_TOKEN=release-contract-validation-only-000000000000 \
            docker compose --env-file /dev/null -f "$compose_path" config --format json |
            jq -er '.services["personal-ledger"].image')"
          repository="${GITHUB_REPOSITORY,,}"
          image_prefix="ghcr.io/${repository}@"
          if [[ "$compose_image" != "${image_prefix}"* ]]; then
            echo "::error title=Invalid release Compose image::Unexpected immutable image: $compose_image"
            exit 1
          fi
          compose_digest="${compose_image#"$image_prefix"}"
          if [[ ! "$compose_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Invalid release Compose digest::Unexpected immutable digest: $compose_digest"
            exit 1
          fi

          version_image="ghcr.io/${repository}:${RELEASE_VERSION}"
          remote_digest="$(docker buildx imagetools inspect "$version_image" \
            --format '{{json .Manifest}}' |
            jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          if [ "$remote_digest" != "$compose_digest" ]; then
            echo "::error title=Docker/Web release digest mismatch::Compose uses $compose_digest, but $version_image resolves to $remote_digest"
            exit 1
          fi

  web:
    name: Web quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/web.yml

  backend:
    name: Backend and database quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/backend-database.yml

  mobile-quality:
    name: Flutter quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/mobile-quality.yml

  mobile-e2e:
    name: Mobile real-backend E2E gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/mobile-e2e.yml

  public-git-safety:
    name: Public repository safety gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/public-git-safety.yml

  backup-security:
    name: Backup and security contracts
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/security-contracts.yml

  android:
    name: Android
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, backend, web, mobile-quality, mobile-e2e, public-git-safety, backup-security]
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}

  verify-android-artifact:
    name: Verify Android Artifact
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'

      - name: Install Android signature tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::error title=Missing Android SDK manager::sdkmanager is required before verifying Android signatures"
            exit 1
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Download Android artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: artifacts/android-release

      - name: Verify Android artifact signatures
        env:
          RELEASE_ARTIFACT_DIR: artifacts
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REQUIRE_IOS_ARTIFACT: '0'
          VERIFY_ARTIFACT_SIGNATURES: '1'
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: ./scripts/check-release-artifact-files.sh

  ios:
    name: iOS
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, backend, web, mobile-quality, mobile-e2e, public-git-safety, backup-security]
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}

  verify-ios-artifact:
    name: Verify iOS Artifact
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, ios]
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download iOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-ipa
          path: artifacts/ios-ipa

      - name: Verify iOS artifact signature
        env:
          RELEASE_ARTIFACT_DIR: artifacts
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REQUIRE_ANDROID_ARTIFACTS: '0'
          REQUIRE_IOS_ARTIFACT: '1'
          VERIFY_ARTIFACT_SIGNATURES: '1'
          IOS_EXPECTED_TEAM_IDENTIFIER: ${{ vars.IOS_EXPECTED_TEAM_IDENTIFIER }}
        run: ./scripts/check-release-artifact-files.sh

  release:
    name: Attach signed mobile assets to existing release
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, backend, web, mobile-quality, mobile-e2e, public-git-safety, backup-security, android, verify-android-artifact, ios, verify-ios-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Verify Android release artifact checksums
        env:
          RELEASE_ARTIFACT_DIR: artifacts
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REQUIRE_IOS_ARTIFACT: '0'
        run: ./scripts/check-release-artifact-files.sh

      - name: Verify iOS release artifact checksums
        env:
          RELEASE_ARTIFACT_DIR: artifacts
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REQUIRE_ANDROID_ARTIFACTS: '0'
          REQUIRE_IOS_ARTIFACT: '1'
        run: ./scripts/check-release-artifact-files.sh

      - name: Attach signed assets without overwriting the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          append_body: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            artifacts/android-release/*.apk
            artifacts/android-release/*.apk.sha256
            artifacts/android-release/*.aab
            artifacts/android-release/*.aab.sha256
            artifacts/ios-ipa/*.ipa
            artifacts/ios-ipa/*.ipa.sha256
          body: |
            ### Signed mobile clients

            Android APK/AAB and iOS IPA were built from this exact release tag,
            signature-checked, checksum-checked, and attached by the manual signed
            mobile workflow. Docker/Web artifacts remain owned by the tag workflow.
