name: Recover Docker/Web Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable annotated vX.Y.Z tag to recover or verify.
        required: true
        type: string
      failed_run_id:
        description: Completed Release Docker/Web tag run for this exact source.
        required: true
        type: string
      expected_digest:
        description: Required when the version image exists; full sha256 digest from its publisher.
        required: false
        type: string
      publisher_run_id:
        description: Required when the image exists; run with successful scan and publish jobs.
        required: false
        type: string
      verify_only:
        description: Never build or publish; fail unless the existing release is complete.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: personal-ledger-release-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable recovery target
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      version: ${{ steps.target.outputs.version }}
      repository: ${{ steps.target.outputs.repository }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      release_sha: ${{ steps.target.outputs.release_sha }}
      tag_object: ${{ steps.target.outputs.tag_object }}
      image_digest: ${{ steps.target.outputs.image_digest }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted tooling snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Inspect source gates and published state without writing
        id: target
        working-directory: tooling
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.failed_run_id }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          mode_args=()
          if [ "$VERIFY_ONLY" = "true" ]; then mode_args+=(--verify-only); fi
          python3 scripts/release_contract.py recover-plan --source ../source \
            --tag "$TARGET_TAG" --run-id "$SOURCE_RUN_ID" \
            --digest "$EXPECTED_DIGEST" --publisher-run-id "$PUBLISHER_RUN_ID" "${mode_args[@]}"

  docker:
    name: Recover Docker multi-arch image
    if: ${{ needs.validate.outputs.mode == 'build' && !inputs.verify_only }}
    needs: validate
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      source_ref: ${{ needs.validate.outputs.release_sha }}
      source_sha: ${{ needs.validate.outputs.release_sha }}
      publish_environment: release-recovery
    permissions:
      actions: read
      contents: read
      packages: write

  published-image:
    name: Recovered Docker image runtime gate
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    needs: [validate, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_digest: ${{ steps.identity.outputs.image_digest }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted tooling snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify published identity using current tooling
        id: identity
        env:
          TARGET_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.image_digest || needs.docker.outputs.image_digest }}
        run: |
          python3 scripts/release_contract.py verify-image --tag "$TARGET_TAG" --sha "$RELEASE_SHA" --digest "$IMAGE_DIGEST"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify health metrics non-root persistence and cleanup
        env:
          DOCKER_RELEASE_IMAGE: ghcr.io/${{ needs.validate.outputs.repository }}@${{ steps.identity.outputs.image_digest }}
          RUNTIME_DOCKER_RELEASE_EVIDENCE: '1'
          RUN_DOCKER_RELEASE_SMOKE: '1'
        run: ./scripts/check-docker-release-evidence.sh

  release:
    name: Create recovered Docker/Web Release
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.published-image.result == 'success' && needs.validate.outputs.mode != 'verify' && !inputs.verify_only }}
    needs: [validate, published-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-recovery
    permissions:
      contents: write
    steps:
      - name: Checkout trusted tooling snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout pinned release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Create only after rechecking tag and image identity
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          IMAGE_DIGEST: ${{ needs.published-image.outputs.image_digest }}
        run: |
          python3 scripts/release_contract.py publish --source ../source --tag "$TARGET_TAG" \
            --sha "$RELEASE_SHA" --tag-object "$TAG_OBJECT" --digest "$IMAGE_DIGEST"

  verify-assets:
    name: Verify public Docker/Web assets independently
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.published-image.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    needs: [validate, published-image, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted tooling snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout pinned release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Download public assets and verify exact Compose image
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          IMAGE_DIGEST: ${{ needs.published-image.outputs.image_digest }}
        run: |
          python3 scripts/release_contract.py verify-tag --source ../source --tag "$TARGET_TAG" --sha "$RELEASE_SHA" --tag-object "$TAG_OBJECT"
          python3 scripts/release_contract.py verify-image --tag "$TARGET_TAG" --sha "$RELEASE_SHA" --digest "$IMAGE_DIGEST"
          python3 scripts/release_contract.py verify-assets --tag "$TARGET_TAG" --digest "$IMAGE_DIGEST"
