name: Recover Docker/Web Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag whose automatic release did not start.
        required: true
        type: string
      failed_run_id:
        description: Startup-failed Release Docker/Web run for the same tag.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: personal-ledger-release-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable recovery target
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      repository: ${{ steps.repository.outputs.value }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      release_sha: ${{ steps.target.outputs.release_sha }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate recovery request and failed run
        id: request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error title=Invalid recovery ref::Recovery must be dispatched from ${DEFAULT_BRANCH}"
            exit 1
          fi
          expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/release-web-recovery.yml@refs/heads/${DEFAULT_BRANCH}"
          if [ "$GITHUB_WORKFLOW_REF" != "$expected_workflow_ref" ]; then
            echo "::error title=Invalid recovery workflow ref::Expected $expected_workflow_ref, got $GITHUB_WORKFLOW_REF"
            exit 1
          fi
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::Expected vX.Y.Z or a SemVer prerelease tag"
            exit 1
          fi
          if [[ ! "$FAILED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid failed run id::Expected a numeric Actions run id"
            exit 1
          fi

          failed_run="$(mktemp)"
          failed_jobs="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" >"$failed_run"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs" >"$failed_jobs"
          failed_sha="$(python3 - "$failed_run" "$failed_jobs" "$TARGET_TAG" <<'PY'
          import json
          import re
          import sys

          run_path, jobs_path, expected_tag = sys.argv[1:]
          with open(run_path, encoding="utf-8") as handle:
              run = json.load(handle)
          with open(jobs_path, encoding="utf-8") as handle:
              jobs = json.load(handle)

          expected = {
              "name": "Release Docker/Web",
              "path": ".github/workflows/release-web.yml",
              "event": "push",
              "status": "completed",
              "conclusion": "startup_failure",
              "head_branch": expected_tag,
          }
          mismatches = [
              f"{key}={run.get(key)!r}, expected {value!r}"
              for key, value in expected.items()
              if run.get(key) != value
          ]
          if mismatches:
              raise SystemExit("Failed run does not authorize recovery: " + "; ".join(mismatches))
          if jobs.get("total_count") != 0 or jobs.get("jobs"):
              raise SystemExit("Recovery is allowed only when the failed tag workflow started no jobs")
          failed_sha = run.get("head_sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", failed_sha):
              raise SystemExit("Failed run does not contain a valid release commit SHA")
          print(failed_sha)
          PY
          )"
          echo "failed_sha=$failed_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release tag with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable tag and successful source gates
        id: target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FAILED_SOURCE_SHA: ${{ steps.request.outputs.failed_sha }}
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          if [ "$(git cat-file -t "refs/tags/${TARGET_TAG}")" != "tag" ]; then
            echo "::error title=Unannotated release tag::${TARGET_TAG} must be an annotated tag"
            exit 1
          fi

          local_tag_object="$(git rev-parse "refs/tags/${TARGET_TAG}")"
          remote_tag_object="$(git ls-remote origin "refs/tags/${TARGET_TAG}" | awk '{print $1}')"
          if [ -z "$remote_tag_object" ] || [ "$local_tag_object" != "$remote_tag_object" ]; then
            echo "::error title=Remote tag identity mismatch::Could not prove ${TARGET_TAG} is the checked-out remote tag"
            exit 1
          fi

          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          tag_commit="$(git rev-list -n 1 "refs/tags/${TARGET_TAG}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$FAILED_SOURCE_SHA" ] || [ "$checked_out_commit" != "$tag_commit" ]; then
            echo "::error title=Release source identity mismatch::Tag, failed run, and checkout must resolve to the same commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error title=Release is not on the default branch::${TARGET_TAG} is not contained in origin/${DEFAULT_BRANCH}"
            exit 1
          fi

          release_error="$(mktemp)"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" >/dev/null 2>"$release_error"; then
            echo "::error title=Release already exists::Refusing to overwrite GitHub Release ${TARGET_TAG}"
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$release_error"; then
            sed -n '1,20p' "$release_error" >&2
            echo "::error title=Release check failed::Could not prove GitHub Release ${TARGET_TAG} is unused"
            exit 1
          fi

          successful_runs="$(mktemp)"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f head_sha="$tag_commit" \
            -f event=push \
            -f status=success \
            -f per_page=100 >"$successful_runs"
          python3 - "$successful_runs" "$tag_commit" "$DEFAULT_BRANCH" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])

          expected_sha = sys.argv[2]
          expected_branch = sys.argv[3]
          required = {
              ".github/workflows/quality-gate.yml": "Project Quality Gate",
              ".github/workflows/public-git-safety.yml": "Public Git Safety",
          }
          successful = {
              run.get("path"): run.get("name")
              for run in runs
              if run.get("conclusion") == "success"
              and run.get("event") == "push"
              and run.get("head_sha") == expected_sha
              and run.get("head_branch") == expected_branch
          }
          missing = sorted(
              path for path, name in required.items() if successful.get(path) != name
          )
          if missing:
              raise SystemExit("Missing successful source workflow paths for release commit: " + ", ".join(missing))
          PY

          echo "release_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve tag version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.tag }}
          INPUT_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/resolve-release-version.sh --require-build-number

      - name: Verify repository version matches tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./scripts/check-version-consistency.sh

      - name: Normalize repository for GHCR
        id: repository
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Run scope-aware source release gate
        env:
          RELEASE_SCOPE: docker-web
          RELEASE_PHASE: source
          STRICT_FINAL_RELEASE: '1'
        run: ./scripts/check-final-release-gates.sh

  docker:
    name: Recover Docker multi-arch image
    needs: validate
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      source_ref: ${{ needs.validate.outputs.release_sha }}
      source_sha: ${{ needs.validate.outputs.release_sha }}
      publish_environment: release-recovery
    permissions:
      actions: read
      contents: read
      packages: write

  published-image:
    name: Recovered Docker image runtime gate
    needs: [validate, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - name: Verify published manifest and runtime
        env:
          DOCKER_RELEASE_IMAGE: ghcr.io/${{ needs.validate.outputs.repository }}@${{ needs.docker.outputs.image_digest }}
          RELEASE_SCOPE: docker-web
          RELEASE_PHASE: published
          STRICT_FINAL_RELEASE: '1'
        run: ./scripts/check-final-release-gates.sh

  release:
    name: Create recovered Docker/Web Release
    needs: [validate, docker, published-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-recovery
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - name: Reconfirm unused GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          release_error="$(mktemp)"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>"$release_error"; then
            echo "::error title=Release already exists::Refusing to overwrite GitHub Release ${RELEASE_TAG}"
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$release_error"; then
            sed -n '1,20p' "$release_error" >&2
            echo "::error title=Release check failed::Could not prove GitHub Release ${RELEASE_TAG} is unused"
            exit 1
          fi

      - name: Generate immutable release Compose asset
        env:
          RELEASE_IMAGE: ghcr.io/${{ needs.validate.outputs.repository }}@${{ needs.docker.outputs.image_digest }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          output="dist/docker-compose-v${RELEASE_VERSION}.yml"
          bash ./scripts/generate-release-compose.sh "$output"
          env LEDGER_JWT_SECRET=release-compose-validation-only LEDGER_SETUP_TOKEN=release-compose-validation-only docker compose --env-file /dev/null -f "$output" config --quiet
          (
            cd dist
            sha256sum "docker-compose-v${RELEASE_VERSION}.yml" > "docker-compose-v${RELEASE_VERSION}.yml.sha256"
          )

      - name: Create GitHub Release once
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
          RELEASE_REPOSITORY: ${{ needs.validate.outputs.repository }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          compose="dist/docker-compose-v${RELEASE_VERSION}.yml"
          checksum="${compose}.sha256"
          body="$(mktemp)"
          cat >"$body" <<EOF
          ## Personal Ledger v${RELEASE_VERSION}

          本次 Release 面向 Docker/Web 自托管部署，不自动包含正式签名
          Android/iOS 安装包；签名移动端产物由同一 tag 上的手动工作流追加。

          ### Docker

              docker pull ghcr.io/${RELEASE_REPOSITORY}:${RELEASE_VERSION}

          不可变镜像：

              ghcr.io/${RELEASE_REPOSITORY}@${IMAGE_DIGEST}

          Release 附件 \`docker-compose-v${RELEASE_VERSION}.yml\` 已固定到上述 digest；
          同时下载对应 \`.sha256\` 后校验再部署。

          ### 文档与截图

          - README：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/README.md
          - 功能文档：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${RELEASE_TAG}/docs/features
          - 运行截图索引：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${RELEASE_TAG}/docs/screenshots
          EOF

          prerelease_args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$compose" "$checksum" \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --title "Release v${RELEASE_VERSION}" \
            --generate-notes \
            --notes-file "$body" \
            "${prerelease_args[@]}"
