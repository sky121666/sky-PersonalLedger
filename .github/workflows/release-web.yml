name: Release Docker/Web

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: personal-ledger-release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate immutable release target
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      build_number: ${{ steps.version.outputs.BUILD_NUMBER }}
      repository: ${{ steps.repository.outputs.value }}
    permissions:
      contents: read
    steps:
      - name: Checkout release tag with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag version
        id: version
        env:
          INPUT_VERSION: ${{ github.ref_name }}
          INPUT_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/resolve-release-version.sh --require-build-number

      - name: Verify repository version matches tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./scripts/check-version-consistency.sh

      - name: Normalize repository for GHCR
        id: repository
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Verify tag ancestry and reject release reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          tag="v${RELEASE_VERSION}"
          if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
            echo "::error title=Tag mismatch::Expected refs/tags/${tag}, got ${GITHUB_REF}"
            exit 1
          fi

          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error title=Tag commit mismatch::${tag} does not resolve to the workflow commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error title=Release is not on main::${tag} must point to a commit contained in origin/main"
            exit 1
          fi

          release_error="$(mktemp)"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>"$release_error"; then
            echo "::error title=Release already exists::Refusing to overwrite GitHub Release ${tag}"
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$release_error"; then
            sed -n '1,20p' "$release_error" >&2
            echo "::error title=Release check failed::Could not prove GitHub Release ${tag} is unused"
            exit 1
          fi

  web:
    name: Web quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/web.yml

  backend:
    name: Backend quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/backend-database.yml

  public-git-safety:
    name: Public repository safety
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/public-git-safety.yml

  backup-security:
    name: Backup and security contracts
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/security-contracts.yml

  source-release-contract:
    name: Docker/Web source release contract
    if: ${{ github.server_url == 'https://github.com' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run scope-aware source release gate
        env:
          RELEASE_SCOPE: docker-web
          RELEASE_PHASE: source
          STRICT_FINAL_RELEASE: '1'
        run: ./scripts/check-final-release-gates.sh

  docker:
    name: Docker multi-arch image
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, web, backend, public-git-safety, backup-security, source-release-contract]
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      packages: write

  published-image:
    name: Published Docker image runtime gate
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify published manifest and runtime
        env:
          DOCKER_RELEASE_IMAGE: ghcr.io/${{ needs.prepare.outputs.repository }}@${{ needs.docker.outputs.image_digest }}
          RELEASE_SCOPE: docker-web
          RELEASE_PHASE: published
          STRICT_FINAL_RELEASE: '1'
        run: ./scripts/check-final-release-gates.sh

  release:
    name: Create Docker/Web Release
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, web, backend, public-git-safety, backup-security, docker, published-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate immutable release Compose asset
        env:
          RELEASE_IMAGE: ghcr.io/${{ needs.prepare.outputs.repository }}@${{ needs.docker.outputs.image_digest }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          output="dist/docker-compose-v${RELEASE_VERSION}.yml"
          bash ./scripts/generate-release-compose.sh "$output"
          env LEDGER_JWT_SECRET=release-compose-validation-only LEDGER_SETUP_TOKEN=release-compose-validation-only docker compose --env-file /dev/null -f "$output" config --quiet
          (
            cd dist
            sha256sum "docker-compose-v${RELEASE_VERSION}.yml" > "docker-compose-v${RELEASE_VERSION}.yml.sha256"
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/docker-compose-v${{ needs.prepare.outputs.version }}.yml
            dist/docker-compose-v${{ needs.prepare.outputs.version }}.yml.sha256
          body: |
            ## Personal Ledger v${{ needs.prepare.outputs.version }}

            本次 Release 面向 Docker/Web 自托管部署，不自动包含正式签名
            Android/iOS 安装包；签名移动端产物由同一 tag 上的手动工作流追加。

            ### Docker

                docker pull ghcr.io/${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.version }}

            不可变镜像：

                ghcr.io/${{ needs.prepare.outputs.repository }}@${{ needs.docker.outputs.image_digest }}

            Release 附件 `docker-compose-v${{ needs.prepare.outputs.version }}.yml`
            已固定到上述 digest；同时下载对应 `.sha256` 后校验再部署。

            ### 文档与截图

            - README：${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README.md
            - 功能文档：${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/docs/features
            - 运行截图索引：${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/docs/screenshots
