name: Release Docker/Web

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: personal-ledger-release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate immutable release target
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      build_number: ${{ steps.version.outputs.BUILD_NUMBER }}
      repository: ${{ steps.repository.outputs.value }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
    permissions:
      contents: read
    steps:
      - name: Checkout release tag with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag version
        id: version
        env:
          INPUT_VERSION: ${{ github.ref_name }}
          INPUT_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/resolve-release-version.sh --require-build-number

      - name: Verify repository version matches tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./scripts/check-version-consistency.sh

      - name: Normalize repository for GHCR
        id: repository
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Pin annotated tag identity
        id: identity
        env:
          TARGET_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release_contract.py verify-tag --tag "$TARGET_TAG" --sha "$GITHUB_SHA"
          echo "tag_object=$(git rev-parse "refs/tags/$TARGET_TAG")" >> "$GITHUB_OUTPUT"

      - name: Verify tag ancestry and reject release reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          tag="v${RELEASE_VERSION}"
          if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
            echo "::error title=Tag mismatch::Expected refs/tags/${tag}, got ${GITHUB_REF}"
            exit 1
          fi

          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error title=Tag commit mismatch::${tag} does not resolve to the workflow commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error title=Release is not on main::${tag} must point to a commit contained in origin/main"
            exit 1
          fi

          release_error="$(mktemp)"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>"$release_error"; then
            echo "::error title=Release already exists::Refusing to overwrite GitHub Release ${tag}"
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$release_error"; then
            sed -n '1,20p' "$release_error" >&2
            echo "::error title=Release check failed::Could not prove GitHub Release ${tag} is unused"
            exit 1
          fi

  web:
    name: Web quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/web.yml

  backend:
    name: Backend quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/backend-database.yml

  public-git-safety:
    name: Public repository safety
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/public-git-safety.yml

  backup-security:
    name: Backup and security contracts
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/security-contracts.yml

  source-release-contract:
    name: Docker/Web source release contract
    if: ${{ github.server_url == 'https://github.com' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run scope-aware source release gate
        env:
          RELEASE_SCOPE: docker-web
          RELEASE_PHASE: source
          STRICT_FINAL_RELEASE: '1'
        run: ./scripts/check-final-release-gates.sh

  docker:
    name: Docker multi-arch image
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, web, backend, public-git-safety, backup-security, source-release-contract]
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_ref: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}
      publish_environment: release
    permissions:
      actions: read
      contents: read
      packages: write

  published-image:
    name: Published Docker image runtime gate
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify published manifest and runtime
        env:
          DOCKER_RELEASE_IMAGE: ghcr.io/${{ needs.prepare.outputs.repository }}@${{ needs.docker.outputs.image_digest }}
          RELEASE_SCOPE: docker-web
          RELEASE_PHASE: published
          STRICT_FINAL_RELEASE: '1'
        run: ./scripts/check-final-release-gates.sh

  release:
    name: Create Docker/Web Release
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, web, backend, public-git-safety, backup-security, docker, published-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create only after rechecking tag and image identity
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
        run: |
          python3 scripts/release_contract.py publish --tag "$TARGET_TAG" \
            --sha "$GITHUB_SHA" --tag-object "$TAG_OBJECT" --digest "$IMAGE_DIGEST"

  verify-assets:
    name: Verify public Docker/Web assets independently
    needs: [prepare, docker, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release tag with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download public assets and verify exact Compose image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
        run: |
          python3 scripts/release_contract.py verify-tag --tag "$TARGET_TAG" --sha "$GITHUB_SHA" --tag-object "$TAG_OBJECT"
          python3 scripts/release_contract.py verify-image --tag "$TARGET_TAG" --sha "$GITHUB_SHA" --digest "$IMAGE_DIGEST"
          python3 scripts/release_contract.py verify-assets --tag "$TARGET_TAG" --digest "$IMAGE_DIGEST"
