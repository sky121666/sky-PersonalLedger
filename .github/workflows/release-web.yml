name: Release Docker/Web

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare version
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      build_number: ${{ steps.version.outputs.BUILD_NUMBER }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve tag version
        id: version
        env:
          INPUT_VERSION: ${{ github.ref_name }}
          INPUT_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/resolve-release-version.sh --require-build-number

      - name: Verify repository version matches tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./scripts/check-version-consistency.sh

  web:
    name: Web quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/web.yml

  backend:
    name: Backend quality gate
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/backend-database.yml

  public-git-safety:
    name: Public repository safety
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/public-git-safety.yml

  backup-security:
    name: Backup and security contracts
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/security-contracts.yml

  docker:
    name: Docker multi-arch image
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, web, backend, public-git-safety, backup-security]
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish_latest: true
    permissions:
      contents: read
      packages: write

  release:
    name: Create Docker/Web Release
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [prepare, web, backend, public-git-safety, backup-security, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## Personal Ledger v${{ needs.prepare.outputs.version }}

            本次 Release 面向 Docker/Web 自托管部署，不包含正式签名 Android/iOS 安装包。

            ### Docker

                docker pull ghcr.io/sky121666/sky-personalledger:${{ needs.prepare.outputs.version }}

            不可变镜像 digest：

                ghcr.io/sky121666/sky-personalledger@${{ needs.docker.outputs.image_digest }}

            ### 文档与截图

            - README：${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README.md
            - 功能文档：${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/docs/features
            - 运行截图索引：${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/docs/screenshots
