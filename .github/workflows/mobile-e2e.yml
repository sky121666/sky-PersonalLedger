name: Mobile Real Backend E2E

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'scripts/verify-mobile-e2e.sh'
      - '.github/workflows/mobile-e2e.yml'
      - '.github/workflows/mobile-platform-e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'scripts/verify-mobile-e2e.sh'
      - '.github/workflows/mobile-e2e.yml'
      - '.github/workflows/mobile-platform-e2e.yml'

permissions:
  contents: read

jobs:
  flutter-tester:
    name: Real backend on flutter-tester
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify real backend mobile flow
        env:
          RUN_FLUTTER_TESTER_E2E: "1"
          RUN_ANDROID_E2E: "0"
          RUN_IOS_E2E: "0"
        run: ./scripts/verify-mobile-e2e.sh
