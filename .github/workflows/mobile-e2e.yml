name: Mobile Real Backend E2E

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'scripts/verify-mobile-e2e.sh'
      - '.github/workflows/mobile-e2e.yml'
      - '.github/workflows/mobile-platform-e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'scripts/verify-mobile-e2e.sh'
      - '.github/workflows/mobile-e2e.yml'
      - '.github/workflows/mobile-platform-e2e.yml'

permissions:
  contents: read

jobs:
  flutter-tester:
    name: Real backend on flutter-tester
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify real backend mobile flow
        env:
          RUN_FLUTTER_TESTER_E2E: "1"
          RUN_ANDROID_E2E: "0"
          RUN_IOS_E2E: "0"
        run: ./scripts/verify-mobile-e2e.sh
