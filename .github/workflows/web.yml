name: Web CI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'scripts/check-web-performance-budget.sh'
      - 'scripts/verify-web-e2e.sh'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'web/**'
      - 'scripts/check-web-performance-budget.sh'
      - 'scripts/verify-web-e2e.sh'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  web:
    name: Test and build
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Verify deferred attachment cleanup
        run: pnpm verify:attachments

      - name: Build web
        run: pnpm build

      - name: Enforce production bundle budgets
        run: pnpm verify:bundle

      - name: Install Chromium for E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real-backend browser E2E
        working-directory: ${{ github.workspace }}
        run: ./scripts/verify-web-e2e.sh
