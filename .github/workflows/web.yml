name: Web CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Test and build
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            web/pnpm-workspace.yaml

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Verify deferred attachment cleanup
        run: pnpm verify:attachments

      - name: Build web
        run: pnpm build

      - name: Enforce production bundle budgets
        run: pnpm verify:bundle

      - name: Install Chromium for E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real-backend browser E2E
        working-directory: ${{ github.workspace }}
        run: ./scripts/verify-web-e2e.sh
