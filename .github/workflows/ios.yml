name: Build iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.8'
        required: true
        type: string
      build_number:
        description: 'Release build number'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
    secrets:
      IOS_CERTIFICATE_BASE64:
        required: true
      IOS_CERTIFICATE_PASSWORD:
        required: true
      IOS_PROVISIONING_PROFILE_BASE64:
        required: true
      IOS_EXPORT_OPTIONS_PLIST_BASE64:
        required: true
      IOS_KEYCHAIN_PASSWORD:
        required: true

jobs:
  ios:
    name: Build signed iOS IPA
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Validate signing secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_EXPORT_OPTIONS_PLIST_BASE64 IOS_KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing iOS signing secret::$name is required for signed IPA export"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install signing material
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > ios_certificate.p12
          security import ios_certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" build.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/personal-ledger.mobileprovision"

          printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > mobile/ios/ExportOptions.plist

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build IPA
        working-directory: mobile
        run: flutter build ipa --release --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ steps.version.outputs.BUILD_NUMBER }} --export-options-plist=ios/ExportOptions.plist

      - name: Rename IPA
        run: |
          ipa_path="$(find mobile/build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "::error title=Missing IPA::No IPA produced under mobile/build/ios/ipa"
            exit 1
          fi
          mv "$ipa_path" "mobile/build/ios/ipa/personal-ledger-${{ steps.version.outputs.VERSION }}-ios.ipa"

      - name: Generate IPA checksum
        run: |
          (
            cd mobile/build/ios/ipa
            shasum -a 256 personal-ledger-${{ steps.version.outputs.VERSION }}-ios.ipa > personal-ledger-${{ steps.version.outputs.VERSION }}-ios.ipa.sha256
          )

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            mobile/build/ios/ipa/personal-ledger-*.ipa
            mobile/build/ios/ipa/personal-ledger-*.ipa.sha256
          retention-days: 90
