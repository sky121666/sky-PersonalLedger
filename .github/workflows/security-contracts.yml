name: Security Contracts

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/check-ai-privacy-contract.sh'
      - 'scripts/check-backup-api-rehearsal.sh'
      - 'scripts/check-backup-restore-rehearsal.sh'
      - 'scripts/check-external-integration-contracts.sh'
      - 'scripts/check-runtime-health-contract.sh'
      - '.github/workflows/security-contracts.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/check-ai-privacy-contract.sh'
      - 'scripts/check-backup-api-rehearsal.sh'
      - 'scripts/check-backup-restore-rehearsal.sh'
      - 'scripts/check-external-integration-contracts.sh'
      - 'scripts/check-runtime-health-contract.sh'
      - '.github/workflows/security-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Backup, API, privacy, and integration contracts
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Verify runtime health contract
        run: ./scripts/check-runtime-health-contract.sh

      - name: Verify AI privacy contract
        run: ./scripts/check-ai-privacy-contract.sh

      - name: Rehearse service-level backup and restore
        run: ./scripts/check-backup-restore-rehearsal.sh

      - name: Rehearse backup and restore through the HTTP API
        run: ./scripts/check-backup-api-rehearsal.sh

      - name: Verify deterministic external integration contracts
        run: ./scripts/check-external-integration-contracts.sh
