name: Security Contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    name: Backup, API, privacy, and integration contracts
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify exact release inventory and evidence contracts
        run: |
          python3 scripts/test_release_evidence.py
          STRICT_RELEASE_SCOPE=1 ./scripts/check-release-change-inventory.sh

      - name: Execute current-source backup operator HTTP drill
        env:
          BACKUP_OPERATOR_DRILL_PROOF_FILE: ${{ runner.temp }}/backup-operator-drill-proof.json
        run: ./scripts/check-backup-operator-drill-local.sh

      - name: Verify current-source backup operator proof
        env:
          STRICT_BACKUP_OPERATOR_DRILL: '1'
          BACKUP_OPERATOR_DRILL_PROOF_FILE: ${{ runner.temp }}/backup-operator-drill-proof.json
          BACKUP_OPERATOR_DRILL_EXPECTED_COMMIT: ${{ github.sha }}
          BACKUP_OPERATOR_DRILL_REQUIRE_CLEAN: '1'
        run: ./scripts/check-backup-operator-drill.sh

      - name: Upload executed current-source backup proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-operator-drill-proof
          path: ${{ runner.temp }}/backup-operator-drill-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Verify runtime health contract
        run: ./scripts/check-runtime-health-contract.sh

      - name: Verify release recovery behavior and workflow contracts
        run: |
          python3 scripts/test_release_contract.py
          python3 scripts/test_release_scan_proof.py
          python3 scripts/test_docker_persistence_probe.py
          ./scripts/check-docker-release-preflight.sh

      - name: Verify AI privacy contract
        run: ./scripts/check-ai-privacy-contract.sh

      - name: Rehearse service-level backup and restore
        run: ./scripts/check-backup-restore-rehearsal.sh

      - name: Rehearse backup and restore through the HTTP API
        run: ./scripts/check-backup-api-rehearsal.sh

      - name: Verify deterministic external integration contracts
        run: ./scripts/check-external-integration-contracts.sh
