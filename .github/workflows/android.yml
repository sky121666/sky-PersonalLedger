name: Build Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.8'
        required: true
        type: string
      build_number:
        description: 'Release build number'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

jobs:
  android:
    name: Build Android APK and AAB
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android wrapper files
        run: |
          test -f mobile/android/gradle/wrapper/gradle-wrapper.properties
          test -f mobile/android/gradle/wrapper/gradle-wrapper.jar
          test -f mobile/android/gradlew
          test -f mobile/android/gradlew.bat

      - name: Set version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "BUILD_NUMBER=${{ inputs.build_number }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0" >> $GITHUB_OUTPUT
            echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Update version in pubspec.yaml
        working-directory: mobile
        run: |
          sed -i "s/version: .*/version: ${{ steps.version.outputs.VERSION }}+${{ steps.version.outputs.BUILD_NUMBER }}/" pubspec.yaml

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Configure Android release signing
        if: inputs.version != ''
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Android signing secret::$name is required for release APK signing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK
        if: inputs.version != ''
        working-directory: mobile
        run: flutter build apk --release --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ steps.version.outputs.BUILD_NUMBER }}

      - name: Build App Bundle
        if: inputs.version != ''
        working-directory: mobile
        run: flutter build appbundle --release --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ steps.version.outputs.BUILD_NUMBER }}

      - name: Rename APK
        if: inputs.version != ''
        run: |
          mv mobile/build/app/outputs/flutter-apk/app-release.apk \
             mobile/build/app/outputs/flutter-apk/personal-ledger-${{ steps.version.outputs.VERSION }}-android.apk

      - name: Rename App Bundle
        if: inputs.version != ''
        run: |
          mv mobile/build/app/outputs/bundle/release/app-release.aab \
             mobile/build/app/outputs/bundle/release/personal-ledger-${{ steps.version.outputs.VERSION }}-android.aab

      - name: Verify Android release signatures
        if: inputs.version != ''
        run: |
          APK_PATH="mobile/build/app/outputs/flutter-apk/personal-ledger-${{ steps.version.outputs.VERSION }}-android.apk"
          AAB_PATH="mobile/build/app/outputs/bundle/release/personal-ledger-${{ steps.version.outputs.VERSION }}-android.aab"
          SDK_ROOTS=()
          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOTS+=("$ANDROID_HOME")
          fi
          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ "${ANDROID_SDK_ROOT:-}" != "${ANDROID_HOME:-}" ]; then
            SDK_ROOTS+=("$ANDROID_SDK_ROOT")
          fi
          SDK_ROOTS+=(
            "$HOME/Library/Android/sdk"
            "/usr/local/lib/android/sdk"
            "/opt/android-sdk"
          )
          APKSIGNER=""
          for SDK_ROOT in "${SDK_ROOTS[@]}"; do
            if [ -d "$SDK_ROOT/build-tools" ]; then
              APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
              if [ -n "$APKSIGNER" ]; then
                break
              fi
            fi
          done
          if [ -z "$APKSIGNER" ]; then
            echo "::error title=Missing apksigner::Android build-tools apksigner was not found"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          jarsigner -verify -strict -certs "$AAB_PATH"

      - name: Generate Android checksums
        if: inputs.version != ''
        run: |
          (
            cd mobile/build/app/outputs/flutter-apk
            shasum -a 256 personal-ledger-${{ steps.version.outputs.VERSION }}-android.apk > personal-ledger-${{ steps.version.outputs.VERSION }}-android.apk.sha256
          )
          (
            cd mobile/build/app/outputs/bundle/release
            shasum -a 256 personal-ledger-${{ steps.version.outputs.VERSION }}-android.aab > personal-ledger-${{ steps.version.outputs.VERSION }}-android.aab.sha256
          )

      - name: Upload Android artifacts
        if: inputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            mobile/build/app/outputs/flutter-apk/personal-ledger-*.apk
            mobile/build/app/outputs/flutter-apk/personal-ledger-*.apk.sha256
            mobile/build/app/outputs/bundle/release/personal-ledger-*.aab
            mobile/build/app/outputs/bundle/release/personal-ledger-*.aab.sha256
          retention-days: ${{ inputs.version != '' && 90 || 7 }}
