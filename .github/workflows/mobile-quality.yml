name: Mobile Quality

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-quality.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-quality.yml'

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze, test, and premium smoke
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze Flutter
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run premium screen smoke tests
        run: flutter test -d flutter-tester integration_test/premium_screens_smoke_test.dart
