name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.8'
        required: true
        type: string
      build_number:
        description: 'Release build number'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string

jobs:
  windows:
    name: Build Windows App
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: ./scripts/resolve-release-version.sh --require-build-number

      - name: Verify repository version matches build input
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./scripts/check-version-consistency.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'

      - name: Update version in pubspec.yaml
        working-directory: mobile
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Windows
        working-directory: mobile
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
        run: flutter build windows --release --build-name="$env:VERSION" --build-number="$env:BUILD_NUMBER"

      - name: Create ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          Compress-Archive -Path "mobile\build\windows\x64\runner\Release\*" `
            -DestinationPath "mobile\build\windows\personal-ledger-$($env:VERSION)-windows.zip"

      - name: Upload Windows App
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: mobile/build/windows/personal-ledger-*.zip
          retention-days: ${{ inputs.version != '' && 90 || 7 }}
