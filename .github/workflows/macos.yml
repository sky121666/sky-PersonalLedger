name: Build macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.8'
        required: true
        type: string
      build_number:
        description: 'Release build number'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string

jobs:
  macos:
    name: Build macOS App
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: ./scripts/resolve-release-version.sh --require-build-number

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Update version in pubspec.yaml
        working-directory: mobile
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
        run: |
          sed -i '' "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build macOS
        working-directory: mobile
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
        run: flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Create ZIP
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd mobile/build/macos/Build/Products/Release
          zip -r "personal-ledger-${VERSION}-macos.zip" personal_ledger.app

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: mobile/build/macos/Build/Products/Release/personal-ledger-*.zip
          retention-days: ${{ inputs.version != '' && 90 || 7 }}
