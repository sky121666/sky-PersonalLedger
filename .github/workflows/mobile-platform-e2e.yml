name: Mobile Platform Real Backend E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-platform-e2e.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform target to run: android or ios."
        required: true
        default: android

permissions:
  contents: read

jobs:
  validate:
    name: Validate manual platform workflow
    if: ${{ github.server_url == 'https://github.com' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm workflow file is loadable
        run: echo "Manual Android/iOS E2E workflow is available through workflow_dispatch."

  android:
    name: Real backend on Android emulator
    if: ${{ github.server_url == 'https://github.com' && github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_E2E_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Install Android emulator runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Install Android emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "cmdline-tools;latest" \
            "$ANDROID_E2E_SYSTEM_IMAGE"

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify real backend Android flow
        env:
          GRADLE_E2E_USER_HOME: ${{ runner.temp }}/sky-ledger-gradle-home
          RUN_FLUTTER_TESTER_E2E: "0"
          RUN_ANDROID_E2E: "1"
          RUN_IOS_E2E: "0"
          LEDGER_MOBILE_E2E_TIMEOUT_SECONDS: "1800"
        run: ./scripts/verify-mobile-e2e.sh

  ios:
    name: Real backend on iOS simulator
    if: ${{ github.server_url == 'https://github.com' && github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify real backend iOS flow
        env:
          RUN_FLUTTER_TESTER_E2E: "0"
          RUN_ANDROID_E2E: "0"
          RUN_IOS_E2E: "1"
        run: ./scripts/verify-mobile-e2e.sh
