name: Forgejo CI

on:
  push:
    branches:
      - main
      - codex/**
    paths:
      - backend/**
      - web/**
      - mobile/**
      - Dockerfile
      - docker-compose.yml
      - .forgejo/workflows/**
  workflow_dispatch:

jobs:
  runner-smoke:
    name: Runner Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Check runner
        run: |
          echo "Forgejo CI on ${GITHUB_SERVER_URL}"
          uname -a
          git rev-parse --short HEAD
          test -f Dockerfile
          command -v node || true
          command -v npm || true
          docker version || true

  docker-build:
    name: Docker Build
    needs: runner-smoke
    if: ${{ vars.FORGEJO_DOCKER_BUILD == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Check Docker access
        run: docker version

      - name: Build image
        run: |
          short_sha="${GITHUB_SHA:-dev}"
          short_sha="${short_sha:0:12}"
          docker build \
            --pull=false \
            --build-arg VERSION="forgejo-${short_sha}" \
            -t "personal-ledger:forgejo-${short_sha}" \
            .
