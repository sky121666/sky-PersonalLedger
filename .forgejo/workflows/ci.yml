name: Forgejo Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  runner-smoke:
    name: Runner Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Check runner
        run: |
          echo "Forgejo CI on ${GITHUB_SERVER_URL}"
          uname -a
          git rev-parse --short HEAD
          test -f Dockerfile
          command -v node || true
          command -v corepack || true
          command -v pnpm || true
          docker version || true
          echo "Release ref: ${GITHUB_REF_NAME:-manual}"

      - name: Check tracked file safety
        run: ./scripts/check-public-git-safety.sh

  docker-build:
    name: Docker Build
    needs: runner-smoke
    if: ${{ vars.FORGEJO_DOCKER_BUILD == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Check Docker access
        run: docker version

      - name: Build image
        run: |
          short_sha="${GITHUB_SHA:-dev}"
          short_sha="${short_sha:0:12}"
          version="${GITHUB_REF_NAME:-forgejo-${short_sha}}"
          version="${version#v}"
          docker build \
            --pull=false \
            --build-arg VERSION="${version}" \
            -t "personal-ledger:${version}" \
            .
