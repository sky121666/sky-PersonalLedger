name: Forgejo Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  runner-smoke:
    name: Runner and repository smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check runner
        run: |
          echo "Forgejo CI on ${GITHUB_SERVER_URL}"
          uname -a
          git rev-parse --short HEAD
          test -f Dockerfile
          command -v node || true
          command -v corepack || true
          command -v pnpm || true
          docker version || true
          echo "Smoke ref: ${GITHUB_REF_NAME:-manual}"

      - name: Check tracked file safety
        run: ./scripts/check-public-git-safety.sh

  docker-build:
    name: Local Docker build smoke
    needs: runner-smoke
    if: ${{ vars.FORGEJO_DOCKER_BUILD == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Docker access
        run: docker version

      - name: Build image
        run: |
          short_sha="${GITHUB_SHA:-dev}"
          short_sha="${short_sha:0:12}"
          version="forgejo-${short_sha}"
          docker build \
            --pull=false \
            --build-arg VERSION="${version}" \
            -t "personal-ledger:${version}" \
            .
